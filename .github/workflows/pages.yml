name: Web (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["site/**", "GUIA.html", "assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: ¿GitHub Pages activado?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then echo "on=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::GitHub Pages no está activado: Settings → Pages → Source: GitHub Actions"; echo "on=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.pages.outputs.on == 'true'
      - name: Montar la web
        if: steps.pages.outputs.on == 'true'
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp GUIA.html _site/guia.html
          cp -R assets _site/assets
          V="$(tr -d '[:space:]' < VERSION)"
          sed -i "s/v1\.0\.0/v$V/g" _site/index.html
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.on == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.on == 'true'
        with:
          path: _site
      - id: deployment
        if: steps.pages.outputs.on == 'true'
        uses: actions/deploy-pages@v4
