name: Release

# Se lanza al publicar una release (desde GitHub o con la API) o al subir un tag vX.Y.Z.
# Construye el zip, lo adjunta a la release con SHA256SUMS y publica en npm con Trusted Publishing.
on:
  release:
    types: [published]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release (por ejemplo v1.0.0)"
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Tag
        run: |
          T="${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
          echo "TAG=$T" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          # lanzado a mano: se publica desde la rama elegida y la release crea el tag
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: El tag coincide con VERSION y package.json
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          [ "v$V" = "$TAG" ] || { echo "::error::El tag $TAG no coincide con VERSION ($V)"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Comprobaciones y pruebas
        run: |
          bash scripts/check.sh
          bash tests/test_install.sh
          bash tests/test_cli.sh

      - name: Empaquetar
        run: bash scripts/build-release.sh

      - name: Notas desde CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md | sed '/^\[.*\]: http/d' > notes.md
          cat >> notes.md <<NOTES

          ### Instalar
          \`\`\`bash
          npx orca-multiagent-kit@$VERSION install
          \`\`\`
          O descarga \`orca-multiagent-kit-v$VERSION.zip\`, descomprime y ejecuta \`./install.sh\`. Integridad: \`SHA256SUMS\`.
          NOTES

      - name: Crear o actualizar la release y adjuntar el zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Orca Multiagent Kit $TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "Orca Multiagent Kit $TAG" --notes-file notes.md --latest
          fi
          gh release upload "$TAG" --clobber dist/orca-multiagent-kit-v$VERSION.zip dist/orca-multiagent-kit.zip dist/SHA256SUMS

      - name: Publicar en npm (Trusted Publishing, sin tokens)
        # npm reconoce este workflow por OIDC (configurado en npmjs.com → Settings → Trusted Publisher).
        # La procedencia (provenance) se adjunta automáticamente.
        run: |
          npm install -g npm@latest
          if npm view "orca-multiagent-kit@$VERSION" version >/dev/null 2>&1; then
            echo "orca-multiagent-kit@$VERSION ya está en npm"
          else
            npm publish --access public
          fi
