name: Release

# Automático: al fusionar en main un cambio de VERSION se publica esa versión (si aún no existe).
# También a mano: publicando una release en GitHub o con «Run workflow».
# Construye el zip, lo adjunta a la release con SHA256SUMS y publica en npm con Trusted Publishing.
on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release (por ejemplo v1.0.0)"
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # release publicada: su tag · a mano: la rama elegida · fusión en main: ese commit
          ref: ${{ github.event.release.tag_name || (github.event_name == 'workflow_dispatch' && github.ref) || github.sha }}

      - name: Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="${{ github.event.release.tag_name || inputs.tag }}"
          [ -n "$T" ] || T="v$(tr -d '[:space:]' < VERSION)"
          echo "TAG=$T" >> "$GITHUB_ENV"
          # en una fusión, solo se salta si la versión ya está en GitHub Y en npm
          # (si npm falló, se reintenta: crear la release otra vez es inocuo)
          if [ "${{ github.event_name }}" = "push" ] && gh release view "$T" >/dev/null 2>&1 \
             && npm view "orca-multiagent-kit@${T#v}" version >/dev/null 2>&1; then
            echo "La versión $T ya está publicada en GitHub y npm: nada que hacer."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: El tag coincide con VERSION y package.json
        if: env.SKIP != '1'
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          [ "v$V" = "$TAG" ] || { echo "::error::El tag $TAG no coincide con VERSION ($V)"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Comprobaciones y pruebas
        if: env.SKIP != '1'
        run: |
          bash scripts/check.sh
          bash tests/test_install.sh
          bash tests/test_cli.sh

      - name: Empaquetar
        if: env.SKIP != '1'
        run: bash scripts/build-release.sh

      - name: Notas desde CHANGELOG.md
        if: env.SKIP != '1'
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md | sed '/^\[.*\]: http/d' > notes.md
          cat >> notes.md <<NOTES

          ### Instalar
          \`\`\`bash
          npx orca-multiagent-kit@$VERSION install
          \`\`\`
          O descarga \`orca-multiagent-kit-v$VERSION.zip\`, descomprime y ejecuta \`./install.sh\`. Integridad: \`SHA256SUMS\`.
          NOTES

      - name: Crear o actualizar la release y adjuntar el zip
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Orca Multiagent Kit $TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "Orca Multiagent Kit $TAG" --notes-file notes.md --latest
          fi
          gh release upload "$TAG" --clobber dist/orca-multiagent-kit-v$VERSION.zip dist/orca-multiagent-kit.zip dist/SHA256SUMS

      - name: Publicar en npm (Trusted Publishing, sin tokens)
        if: env.SKIP != '1'
        # npm reconoce este workflow por OIDC (configurado en npmjs.com → Settings → Trusted Publisher).
        # La procedencia (provenance) se adjunta automáticamente.
        run: |
          npm install -g npm@latest
          # Si falla con «OIDC permission denied for this action»: en npmjs.com → paquete → Settings →
          # Trusted Publisher, marca «npm publish» en Allowed actions (las entradas nuevas solo permiten «stage»).
          if npm view "orca-multiagent-kit@$VERSION" version >/dev/null 2>&1; then
            echo "orca-multiagent-kit@$VERSION ya está en npm"
          else
            npm publish --access public
          fi
